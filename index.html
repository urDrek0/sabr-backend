<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="h1-dummy-pasien" class=""></p>
    <p id="h1-dummy-pegawai" class=""></p>
    <p id="h1-dummy-sabr" class=""></p>
    <p id="h1-dummy-shift-handler" class=""></p>
</body>
<script>
    async function ambilDataPasien() {
        const res = await fetch('http://localhost:3000/api/pasien')
        const data = await res.json()
        return data
    }
    async function renderDataPasien(){
        let dataPasien = await ambilDataPasien()
        document.getElementById('h1-dummy-pasien').innerHTML ='pasien : ' + JSON.stringify(dataPasien)
    }

    async function ambilDataPegawai() {
        const res = await fetch('http://localhost:3000/api/pegawai')
        const data = await res.json()
        return data
    }
    async function renderDataPegawai(){
        let dataPegawai = await ambilDataPegawai()
        document.getElementById('h1-dummy-pegawai').innerHTML ='pegawai : ' + JSON.stringify(dataPegawai)
    }

    async function ambilDataSabr() {
        const res = await fetch('http://localhost:3000/api/sabr_report')
        const data = await res.json()
        return data
    }
    async function renderDataSabr(){
        let dataSabr = await ambilDataSabr()
        document.getElementById('h1-dummy-sabr').innerHTML ='sabr : ' + JSON.stringify(dataSabr)
    }

    async function ambilDataShiftHandler() {
        const res = await fetch('http://localhost:3000/api/shift_handler')
        const data = await res.json()
        return data
    }
    async function renderDataShiftHandler(){
        let dataShiftHandler = await ambilDataShiftHandler()
        document.getElementById('h1-dummy-shift-handler').innerHTML ='shift handler : ' + JSON.stringify(dataShiftHandler)
    }

    renderDataPasien();
    renderDataPegawai();
    renderDataSabr();
    renderDataShiftHandler();
</script>
</html>
